services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: seo_growth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo_growth"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      DATABASE_URL: postgresql+psycopg://seo:${POSTGRES_PASSWORD}@postgres:5432/seo_growth
      MVP_SQLITE_AUTO_CREATE: "0"
    ports:
      - "127.0.0.1:8000:8000" # Not publicly exposed; use reverse proxy with HTTPS + SSO
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
